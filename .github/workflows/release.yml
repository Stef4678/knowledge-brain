name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      # Attest the built artifacts so GitHub can prove they were built from this
      # repo's source — resolves the "missing artifact attestations" flag.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            styles.css

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME#v}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Knowledge Brain ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            main.js manifest.json styles.css
